<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061625"><title>Monsters of Midgard | Kampfoberfläche V1.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#04131e;color:#eef6f8;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #ffdf92;outline-offset:2px}
#app{height:100dvh;max-width:510px;min-height:500px;margin:auto;display:flex;flex-direction:column;background:#061c30;border-inline:2px solid #577c91}
.arena{height:42%;flex:0 0 42%;min-height:0;position:relative;overflow:hidden;background:linear-gradient(#87aec3,#d1dedc 47%,#b1c997 48%,#5a8264);border-bottom:3px solid #83a5aa}
.mountains{position:absolute;inset:12% 0 34%;background:#6c91a1;opacity:.63;clip-path:polygon(0 100%,0 75%,15% 25%,32% 85%,49% 5%,68% 85%,87% 24%,100% 80%,100% 100%)}
.pad{position:absolute;border-radius:50%;background:radial-gradient(#a8c993,#628766);border:2px solid #b6d0aa;box-shadow:0 6px #42664c}.pad.foe{right:4%;top:49%;width:42%;height:13%}.pad.player{left:3%;bottom:12%;width:49%;height:16%}
.actor{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;font-size:10px;font-weight:900;background:#123c4fc5;border:2px dashed #e9d09b;border-radius:11px;color:#f9efdb}.actor b{font:35px Georgia,serif;color:#f5df9c}.actor.foe{right:13%;top:24%;width:88px;height:92px}.actor.player{left:12%;bottom:19%;width:100px;height:107px}
.actor.idle{animation:bob 2s infinite ease-in-out}.actor.enter{animation:appear .85s both}.actor.attack{animation:attack .7s both}.actor.hit{animation:hit .65s both}.actor.out{animation:out .75s both}.ball{position:absolute;z-index:8;left:30%;top:40%;font-size:35px;animation:throw .85s both}.effect{position:absolute;z-index:8;right:25%;top:35%;font:48px Georgia,serif;color:#ffedaa;animation:flash .7s both}
.hud{position:absolute;z-index:4;width:43%;padding:7px;background:linear-gradient(#294959,#071c2c);border:1px solid #bfbdac;border-radius:8px;box-shadow:0 4px 8px #0005}.hud.foe{top:8%;left:3%}.hud.player{bottom:8%;right:3%}.hudline{font-size:11px;font-weight:900;display:flex;justify-content:space-between}.hudline small{font-size:10px;color:#e8cd9d}.meter{height:9px;background:#132939;border-radius:7px;border:1px solid #69828c;overflow:hidden;margin:6px 0 3px}.meter i{display:block;height:100%;width:100%;background:#75df99;transition:width .65s}.hpnum{text-align:right;font-size:10px;font-variant-numeric:tabular-nums}
.dialog{position:absolute;z-index:9;inset:auto 0 0;min-height:25%;display:flex;align-items:center;padding:11px;background:linear-gradient(#1b465cf5,#081d2ffa);border-top:3px solid #a9c5cf;font-size:12px;line-height:1.5}
.touch{height:58%;flex:0 0 58%;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at bottom,#184763,#0b253b 58%,#061726)}
.logo{text-align:center;font:900 clamp(13px,2vh,18px) Georgia,serif;letter-spacing:.08em;color:#f1dbaf;text-shadow:0 0 9px #b58e596a}
.header{flex:none;min-height:32px;display:flex;justify-content:center;align-items:center;gap:9px;border:1px solid #66889a;border-radius:5px;background:linear-gradient(#0b2638,#194055,#082237);font-size:12px;font-weight:900;letter-spacing:.06em}.header:before,.header:after{content:"ᛟ";font:20px Georgia,serif;color:#d3bd8e}
.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:auto}.foot{border-top:1px solid #567789;display:flex;justify-content:space-between;padding-top:4px;font-size:10px;color:#adcbd4}
.btn{position:relative;min-height:44px;border:1.5px solid #899da7;border-radius:7px;padding:8px;background:linear-gradient(#2b5368,#0b273e);box-shadow:inset 0 1px #fff4,0 3px #02101a;font-size:12px;font-weight:850;overflow:hidden}.btn:active:not(:disabled){transform:translateY(2px)}
.ornate{border:2px solid #949b9a;box-shadow:inset 0 0 0 2px #0c1b2a,inset 0 0 0 3px #758e94,0 4px #020d16;background:linear-gradient(145deg,#5c6667,#203c4d 13%,#091c30 65%,#43545b)}.ornate:before{content:"";position:absolute;inset:6px;border:1px solid #aab6ae66;border-radius:3px;pointer-events:none}.ornate:after{content:"ᚱ ᛟ ᚷ";position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#dfc48d88;letter-spacing:.4em;font:10px Georgia,serif;pointer-events:none}
.home{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}.fight{flex:1;min-height:75px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;background:linear-gradient(140deg,#875c46,#4a2837 36%,#241b2d 75%,#78444a);border-color:#d5a58a}.fight em{font:29px Georgia,serif;font-style:normal;color:#ffdfa7}.fight strong{font:900 25px Georgia,serif;letter-spacing:.15em}.fight small{font-size:10px;color:#ecd1be}
.orbs{display:flex;justify-content:center;gap:11px;padding:4px}.orb{width:14px;height:14px;border:2px solid #65899b;border-radius:50%;background:#0b2a3e}.orb.ready{background:#bc5660;border-color:#e5c39b}.orb.active{box-shadow:0 0 0 2px #fbe6bc}.orb.dead{background:#75525e}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.action{min-height:78px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.action em{font:24px Georgia,serif;font-style:normal;color:#f6deaf}.action strong{font-size:12px}.action small{font-size:9px;color:#bdd0d8}.bag{background:linear-gradient(140deg,#7d6849,#413623 60%,#24232a);border-color:#b39a69}.flee{background:linear-gradient(140deg,#596c80,#2a3d51 60%,#142638)}.monster{background:linear-gradient(140deg,#426d61,#1a4845 60%,#0e3037);border-color:#93b6a7}
.panel{padding:11px;border:1px solid #6792a2;border-radius:8px;background:linear-gradient(#1c4256,#082137);font-size:12px;line-height:1.55}.panel strong{color:#f0d4a5}.grow{flex:1}
.moves{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0}.move{display:flex;align-items:flex-start;justify-content:space-between;flex-direction:column;text-align:left}.move strong{font:800 15px Georgia,serif}.move small{font-size:10px;color:#c4dbe5}.plant{background:linear-gradient(#236b54,#123c34);border-color:#85bd9c}
.team{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;flex:1;min-height:0}.team button{text-align:left}.team small{font-size:10px;color:#b9d4df}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes appear{0%{opacity:0;transform:scale(.15)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}@keyframes attack{50%{transform:translateX(18px)}}@keyframes hit{30%,70%{opacity:.22;transform:translateX(-8px)}}@keyframes out{to{opacity:0;transform:scale(.1)}}@keyframes throw{from{opacity:0;transform:translate(-65px,45px)}to{opacity:1;transform:translate(38px,-31px) rotate(380deg)}}@keyframes flash{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
@media(max-height:700px){.touch{padding:5px 7px;gap:5px}.header{min-height:27px}.fight{min-height:56px}.action{min-height:57px}.btn{padding:5px}}
@media(prefers-reduced-motion:reduce){.actor,.ball,.effect{animation-duration:.01ms!important}}
</style></head>
<body><main id="app">
<section class="arena"><div class="mountains"></div><div class="pad foe"></div><div class="pad player"></div><div id="actors"></div>
<div id="enemyHud" class="hud foe"><div class="hudline"><span>Waldwesen</span><small>Lv. 5</small></div><div class="meter"><i id="ebar"></i></div><div id="enum" class="hpnum">36 / 36 KP</div></div>
<div id="playerHud" class="hud player"><div class="hudline"><span id="pname">Eikel</span><small>Lv. 5</small></div><div class="meter"><i id="pbar"></i></div><div id="pnum" class="hpnum">42 / 42 KP</div></div>
<div class="dialog" id="dialog" aria-live="polite"></div></section>
<section class="touch"><div class="logo">ᛟ MONSTERS OF MIDGARD ᛟ</div><div id="header" class="header">KAMPF BEGINNEN</div><div id="content" class="content"></div><div class="foot"><span>ᛉ NORDISCHE BEDIENUNG</span><span>V1.2 · 42/58</span></div></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),B=(s,act,cls='',off=false)=>'<button class="btn '+cls+'" data-action="'+act+'" '+(off?'disabled':'')+'>'+s+'</button>',E=(text,fx='',fn=null,ms=800)=>({text,fx,fn,ms});
const attacks=[{name:'Tackle',damage:9,pp:25,type:'Normal'},{name:'Absorber',damage:12,pp:15,type:'Pflanze'},{name:'Härtner',damage:0,pp:20,type:'Normal'},{name:'Rasierblatt',damage:15,pp:10,type:'Pflanze'}];
let s,timer=null,version=0;
function cancel(){version++;if(timer!==null)clearTimeout(timer);timer=null}
function reset(){cancel();s={page:'start',enemy:false,player:false,ehp:36,hp:[42,44],active:0,pp:attacks.map(a=>a.pp),potions:2,round:1,fx:'',text:'',queue:[],i:0,after:'home',outcome:''};render()}
function play(items,after='home'){cancel();s.page='playing';s.queue=items;s.i=0;s.after=after;advance()}
function advance(){if(s.i>=s.queue.length){end();return}const x=s.queue[s.i++];s.text=x.text;s.fx=x.fx;if(x.fn)x.fn();render();const v=version;timer=setTimeout(()=>{timer=null;if(v===version)advance()},x.ms)}
function end(){cancel();s.fx='';const next=s.after;if(next==='afterAttack'){s.ehp===0?win():enemyAttack();return}if(next==='afterEnemy'){if(s.hp[s.active]===0){faint();return}s.round++}if(next==='afterPotion'||next==='afterSwitch'){enemyAttack();return}s.page=next==='result'?'result':next==='forced'?'forced':'home';render()}
function start(){play([E('Ein wildes Waldwesen erscheint.','enemyEnter',()=>s.enemy=true,1050),E('Der Gegner ist bereit.','',null,560),E('Dein Trainer bereitet den Ballwurf vor.','',null,680),E('Los, Eikel!','ball',null,900),E('Eikel erscheint aus der Kugel.','playerEnter',()=>s.player=true,1050),E('Der Kampf beginnt!','',null,600)])}
function attack(i){const m=attacks[i];if(s.page!=='moves'||!m||s.pp[i]===0)return;s.pp[i]--;const name=s.active?'Klabuni':'Eikel';play([E(name+' setzt '+m.name+' ein!','playerAttack',null,750),E(m.damage?'Der Gegner wird getroffen!':'Verteidigung steigt (Testeffekt).',m.damage?'enemyHit':'',null,680),E(m.damage?'Der Gegner verliert '+m.damage+' Test-KP.':'Statuswirkung aktiv.','',()=>s.ehp=Math.max(0,s.ehp-m.damage),820)],'afterAttack')}
function enemyAttack(){play([E('Das Waldwesen setzt Tackle ein!','enemyAttack',null,750),E('Dein Monster wird getroffen.','playerHit',null,690),E('Es verliert 7 Test-KP.','',()=>s.hp[s.active]=Math.max(0,s.hp[s.active]-7),810)],'afterEnemy')}
function win(){s.outcome='Sieg';play([E('Das Waldwesen ist kampfunfähig.','enemyOut',null,900),E('Du hast gewonnen!','',()=>s.enemy=false,900)],'result')}
function faint(){const other=s.hp.some((n,i)=>i!==s.active&&n>0);if(!other)s.outcome='Niederlage';play([E('Dein Monster ist kampfunfähig.','playerOut',null,870),E(other?'Wähle ein anderes Monster.':'Alle Monster sind kampfunfähig.','',()=>s.player=false,850)],other?'forced':'result')}
function swap(i){if(!['team','forced'].includes(s.page)||i===s.active||s.hp[i]===0)return;const forced=s.page==='forced',name=i?'Klabuni':'Eikel';play([...(forced?[]:[E('Dein Monster wird zurückgerufen.','playerOut',()=>s.player=false,690)]),E('Los, '+name+'!','ball',()=>s.active=i,900),E(name+' erscheint.','playerEnter',()=>s.player=true,1000)],forced?'home':'afterSwitch')}
function potion(){const max=s.active?44:42;if(s.page!=='bag'||s.potions===0||s.hp[s.active]===0||s.hp[s.active]>=max)return;s.potions--;const n=Math.min(15,max-s.hp[s.active]);play([E('Ein Trank wird verwendet.','',null,750),E('Dein Monster erhält '+n+' Test-KP.','',()=>s.hp[s.active]+=n,800)],'afterPotion')}
function flee(){if(s.page!=='home')return;s.outcome='Flucht';play([E('Du fliehst aus dem Kampf.','playerOut',()=>s.player=false,900)],'result')}
function render(){const name=s.active?'Klabuni':'Eikel',v=s.fx;
let actors='';if(s.enemy)actors+='<div class="actor foe '+(v==='enemyEnter'?'enter':v==='enemyAttack'?'attack':v==='enemyHit'?'hit':v==='enemyOut'?'out':'idle')+'"><b>◇</b>GEGNER<br>VORDERANSICHT</div>';
if(s.player)actors+='<div class="actor player '+(v==='playerEnter'?'enter':v==='playerAttack'?'attack':v==='playerHit'?'hit':v==='playerOut'?'out':'idle')+'"><b>ᛟ</b>'+name.toUpperCase()+'<br>RÜCKANSICHT</div>';
if(v==='ball')actors+='<div class="ball">◉</div>';if(v==='enemyHit')actors+='<div class="effect">✧</div>';$('actors').innerHTML=actors;
$('enemyHud').style.display=s.enemy?'block':'none';$('playerHud').style.display=s.player?'block':'none';$('pname').textContent=name;$('enum').textContent=s.ehp+' / 36 KP';$('pnum').textContent=s.hp[s.active]+' / '+(s.active?44:42)+' KP';
[['ebar',s.ehp,36],['pbar',s.hp[s.active],s.active?44:42]].forEach(([id,value,max])=>{const x=$(id),r=value/max;x.style.width=(r*100)+'%';x.style.background=r<=.2?'#e78282':r<=.5?'#e6c776':'#75df99'});
$('dialog').style.display=['playing','result'].includes(s.page)?'flex':'none';$('dialog').textContent=s.text;
$('header').textContent=({start:'KAMPF BEGINNEN',playing:'KAMPFGESCHEHEN',home:'WÄHLE DEINE AKTION',moves:'WÄHLE DEINE ATTACKE',team:'DEIN MONSTERTEAM',bag:'DEIN BEUTEL',forced:'MONSTER WECHSELN',result:'KAMPF BEENDET'})[s.page]||'MIDGARD';
let h='';
if(s.page==='start')h='<div class="panel"><strong>Monsters of Midgard – Kampfoberfläche V1.2</strong><div>Eigenständige HTML-Demo mit nordischen Hauptmenü-Buttons und einem spielbaren Testkampf.</div></div><div class="grow"></div>'+B('ᛟ KAMPF STARTEN ᛟ','start','ornate fight');
if(s.page==='playing')h='<div class="panel"><strong>Kampfszene '+s.i+' / '+s.queue.length+'</strong><div>'+s.text+'</div></div><div class="grow"></div><div class="panel">Die Sequenz läuft automatisch.</div>';
if(s.page==='home')h='<div class="home">'+B('<em>⚔</em><strong>KAMPF</strong><small>Attacke auswählen</small>','moves','ornate fight')+'<div class="orbs">'+[0,1,2,3,4,5].map(i=>'<span class="orb '+(i<2?(s.hp[i]?'ready':'dead'):'')+(i===s.active?' active':'')+'"></span>').join('')+'</div><div class="actions">'+B('<em>▤</em><strong>BEUTEL</strong><small>Gegenstände</small>','bag','ornate action bag')+B('<em>➟</em><strong>FLUCHT</strong><small>Rückzug</small>','flee','ornate action flee')+B('<em>◇</em><strong>MONSTER</strong><small>Team ansehen</small>','team','ornate action monster')+'</div></div>';
if(s.page==='moves')h='<div class="moves">'+attacks.map((a,i)=>B('<strong>'+a.name+'</strong><small>'+a.type+'</small><small>AP '+s.pp[i]+'/'+a.pp+'</small>','attack:'+i,'move '+(a.type==='Pflanze'?'plant':''),s.pp[i]===0)).join('')+'</div>'+B('← Zurück','home');
if(s.page==='team'||s.page==='forced')h='<div class="team">'+[0,1].map(i=>B((i?'Klabuni':'Eikel')+'<br><small>KP '+s.hp[i]+' / '+(i?44:42)+'</small>','swap:'+i,'',i===s.active||s.hp[i]===0)).join('')+Array.from({length:4},()=>B('Freier Platz','none','',true)).join('')+'</div>'+(s.page==='team'?B('← Zurück','home'):'<div class="panel">Wähle ein kampffähiges Monster.</div>');
if(s.page==='bag')h='<div class="panel">Trank ×'+s.potions+'</div>'+B('Trank verwenden','potion','',s.potions===0||s.hp[s.active]===(s.active?44:42))+'<div class="grow"></div>'+B('← Zurück','home');
if(s.page==='result')h='<div class="panel"><strong>'+s.outcome+'</strong><div>'+s.text+'</div></div><div class="grow"></div>'+B('NEUEN KAMPF STARTEN','reset','ornate fight');
$('content').innerHTML=h;
}
$('content').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const [cmd,value]=b.dataset.action.split(':');if(cmd==='reset'){reset();return}if(cmd==='start'&&s.page==='start'){start();return}if(['playing','result'].includes(s.page))return;if(s.page==='forced'&&cmd!=='swap')return;if(['home','moves','team','bag'].includes(cmd)){s.page=cmd;render();return}if(cmd==='attack'){attack(Number(value));return}if(cmd==='swap'){swap(Number(value));return}if(cmd==='potion'){potion();return}if(cmd==='flee'){flee()}});
reset();})();
</script></body></html>
