<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102234"><title>Monster Taimer – Kampfdemo V0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#102234;color:white}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{height:100dvh;min-height:430px;display:flex;flex-direction:column;max-width:640px;margin:auto;overflow:hidden}.top{height:32px;flex:none;background:#102234;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:11px;letter-spacing:.1em;color:#b9d3e1}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#7dc5e4 0%,#d6e8d5 56%,#a0c19a 57%,#739675 100%)}.sun{position:absolute;width:65px;height:65px;border-radius:50%;background:#fff7c4;top:5%;right:8%;opacity:.7}.hill{position:absolute;width:125%;height:32%;left:-12%;top:51%;background:#87b18b;border-radius:50% 50% 0 0}.platform{position:absolute;height:12%;border-radius:50%;background:#648e72;box-shadow:0 5px 0 #4a725b,0 0 0 9px #b3cfad99}.platform.e{width:43%;top:49%;right:6%}.platform.p{width:57%;bottom:12%;left:-5%}.monster{position:absolute;filter:drop-shadow(0 7px 4px #2345);transition:opacity .4s,transform .4s}.monster svg{width:100%;height:100%}.monster.e{width:36%;height:35%;right:11%;top:19%;animation:float 2.6s infinite ease-in-out}.monster.p{width:46%;height:39%;left:4%;bottom:18%;animation:float 2.9s infinite ease-in-out}.stats{position:absolute;z-index:3;width:46%;border:2px solid #344c51;background:#f7f8ed;color:#23363c;border-radius:10px;padding:7px 9px;box-shadow:2px 3px 0 #2235;font-size:clamp(10px,2.6vw,14px)}.stats.e{left:3%;top:7%}.stats.p{right:3%;bottom:4%}.stathead{display:flex;justify-content:space-between;font-weight:800}.bar{margin-top:6px;padding:2px;height:9px;border-radius:9px;background:#304f50}.fill{height:5px;border-radius:6px;background:#47d38c;transition:width .4s}.number{text-align:right;font-size:10px;margin-top:3px}.dialog{flex:none;min-height:74px;padding:12px 16px;background:#f5f1e5;color:#243642;border-top:4px solid #405361;font-size:clamp(13px,3.7vw,17px);font-weight:750;line-height:1.4}.commands{flex:none;background:#162e42;padding:10px 12px calc(10px + env(safe-area-inset-bottom));min-height:165px}.hint{display:flex;justify-content:space-between;color:#acc5d1;font-size:10px;letter-spacing:.12em;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{height:49px;border-radius:11px;background:#f6f5ea;color:#203747;border:1px solid #8099a6;font-weight:800;font-size:14px}.grid button.main{background:#e9b16f}.grid button:disabled{opacity:.55}.grid button:active{transform:scale(.97)}.hit{animation:hit .38s linear!important}.lunge{animation:lunge .4s ease-in-out!important}.fainted{opacity:0!important;transform:translateY(70px) scale(.7)!important;animation:none!important}.burst{position:absolute;z-index:4;right:26%;top:32%;font-size:50px;animation:burst .5s ease-out forwards}@keyframes float{50%{transform:translateY(-7px)}}@keyframes hit{20%,60%{filter:brightness(3);transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes lunge{50%{transform:translate(30px,-15px) scale(1.08)}}@keyframes burst{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.8)}}@media(prefers-reduced-motion:reduce){.monster,.hit,.lunge,.burst{animation:none!important}}
</style></head><body><main id="app"><header class="top"><span>MONSTER TAIMER</span><span>ENTWURF · V0.1</span></header><section class="scene" id="scene" aria-label="Kampfansicht"><div class="sun"></div><div class="hill"></div><div class="platform e"></div><div class="platform p"></div>
<div class="stats e"><div class="stathead"><span>MORO</span><span>Lv. 5</span></div><div class="bar"><div class="fill" id="enemybar"></div></div><div class="number" id="enemyhp">40 / 40 KP</div></div>
<div class="monster e" id="enemy"><svg viewBox="0 0 160 160" role="img" aria-label="Blaues Fantasiemonster Moro"><path d="M40 94 Q20 55 53 36 L40 9 75 30 Q113 16 123 56 L143 26 132 89 Q148 126 108 135 L52 131 Q20 123 40 94Z" fill="#427eb7" stroke="#183e6a" stroke-width="5"/><path d="M46 83 Q70 110 118 79 Q119 121 90 126 L60 122Z" fill="#7db8df"/><ellipse cx="61" cy="69" rx="9" ry="13" fill="white"/><ellipse cx="100" cy="69" rx="9" ry="13" fill="white"/><circle cx="64" cy="72" r="5" fill="#132d48"/><circle cx="98" cy="72" r="5" fill="#132d48"/><path d="M73 91 Q82 99 91 90" fill="none" stroke="#173852" stroke-width="4" stroke-linecap="round"/></svg></div>
<div class="monster p" id="player"><svg viewBox="0 0 190 180" role="img" aria-label="Orangefarbenes Fantasiemonster Auron von hinten"><path d="M29 130 Q10 103 43 76 L23 34 73 54 L89 8 112 51 155 28 142 81 Q185 113 156 146 Q99 171 43 149Z" fill="#da7b3e" stroke="#763d2c" stroke-width="6"/><path d="M43 119 Q91 90 148 118 L154 150 Q95 177 40 146Z" fill="#f2aa65"/><path d="M67 76 L85 48 94 78 M104 77 L121 52 128 86" fill="#f4bf75" stroke="#a85d37" stroke-width="3"/><path d="M37 133 L14 151 M152 130 L177 151" stroke="#a45136" stroke-width="16" stroke-linecap="round"/></svg></div>
<div class="stats p"><div class="stathead"><span>AURON</span><span>Lv. 5</span></div><div class="bar"><div class="fill" id="playerbar"></div></div><div class="number" id="playerhp">48 / 48 KP</div></div></section>
<div class="dialog" id="dialog" role="status" aria-live="polite">Ein wildes Moro erscheint! Was soll Auron tun?</div><section class="commands" aria-label="Touch-Befehle"><div class="hint"><span id="mode">BEFEHLSLEISTE</span><span id="round">RUNDE 1</span></div><div class="grid" id="buttons"></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let p,e,round,potions,guard,busy,ended;
function say(message){$('dialog').textContent=message}
function update(){for(const [bar,n,max] of [['playerbar',p,48],['enemybar',e,40]]){const f=$(bar);f.style.width=(100*n/max)+'%';f.style.background=n/max<.25?'#e76a55':n/max<.5?'#eac65d':'#47d38c'}$('playerhp').textContent=p+' / 48 KP';$('enemyhp').textContent=e+' / 40 KP'}
function menu(mode){$('mode').textContent={main:'BEFEHLSLEISTE',attack:'ATTACKEN',bag:'GEGENSTÄNDE',end:'KAMPFENDE'}[mode];const options=mode==='main'?[['⚔ Angriff',()=>menu('attack')],['🛡 Schutz',()=>act('guard')],['🎒 Tasche',()=>menu('bag')],['↗ Rückzug',()=>act('run')]]:mode==='attack'?[['Glutfunken',()=>act('fire')],['Ansturm',()=>act('tackle')],['← Zurück',()=>menu('main')]]:mode==='bag'?[['Trank ('+potions+')',()=>act('potion')],['← Zurück',()=>menu('main')]]:[['↻ Neustart',reset]];$('buttons').replaceChildren();options.forEach(([label,callback],index)=>{const b=document.createElement('button');b.textContent=label;if(index===0)b.className='main';b.disabled=busy;b.addEventListener('click',()=>{if(!busy)callback()});$('buttons').append(b)})}
function animate(id,cls){const el=$(id);el.classList.remove('hit','lunge');void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),450)}
async function act(type){if(busy||ended)return;busy=true;for(const b of $('buttons').children)b.disabled=true;
if(type==='run'){say('Auron zieht sich aus dem Testkampf zurück.');ended=true;busy=false;menu('end');return}
if(type==='potion'){if(!potions){say('Keine Tränke mehr vorhanden.');busy=false;menu('bag');return}potions--;const healed=Math.min(48-p,18);p+=healed;update();say('Auron erhält '+healed+' KP zurück.');await wait(800)}
if(type==='guard'){guard=true;say('Auron nimmt eine Schutzhaltung ein.');await wait(700)}
if(type==='fire'||type==='tackle'){say('Auron setzt '+(type==='fire'?'Glutfunken':'Ansturm')+' ein!');animate('player','lunge');await wait(430);animate('enemy','hit');const effect=document.createElement('span');effect.className='burst';effect.textContent=type==='fire'?'✦':'✹';$('scene').append(effect);setTimeout(()=>effect.remove(),550);e=Math.max(0,e-(type==='fire'?12:9));update();await wait(760)}
if(e===0){$('enemy').classList.add('fainted');say('Moro ist kampfunfähig. Auron gewinnt den Testkampf!');ended=true;busy=false;menu('end');return}
say('Moro setzt Schattenstoß ein!');await wait(650);animate('player','hit');p=Math.max(0,p-(guard?4:8));guard=false;update();await wait(740);
if(p===0){$('player').classList.add('fainted');say('Auron ist kampfunfähig. Der Testkampf endet.');ended=true;menu('end')}else{round++;$('round').textContent='RUNDE '+round;say('Was soll Auron als Nächstes tun?');busy=false;menu('main')}busy=false}
function reset(){p=48;e=40;round=1;potions=2;guard=false;busy=false;ended=false;$('enemy').classList.remove('fainted');$('player').classList.remove('fainted');$('round').textContent='RUNDE 1';update();say('Ein wildes Moro erscheint! Was soll Auron tun?');menu('main')}
reset();
</script></body></html>
